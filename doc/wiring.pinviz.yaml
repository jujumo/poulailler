title: "Coop Door — ESP32 / DS3231 / BTS7960 wiring"
board: esp32_devkit_v1
show_legend: false
theme: light

devices:
  # Real-time clock. Defined as a custom device (rather than the built-in
  # `ds3231` template) so its pins can be forced onto the right side, facing
  # the board — the RTC sits to the LEFT of the ESP32 in this layout.
  - name: "DS3231 RTC"
    color: "#1ABC9C"
    pins:
      - {name: "VCC", role: "3V3", side: right}
      - {name: "GND", role: "GND", side: right}
      - {name: "SCL", role: "I2C_SCL", side: right}
      - {name: "SDA", role: "I2C_SDA", side: right}
      - {name: "SQW", role: "GPIO", side: right}

  # BTS7960 (IBT-2) H-bridge — custom device (no PinViz template).
  - name: "BTS7960 (IBT-2)"
    width: 130
    color: "#E67E22"
    pins:
      - {name: "VCC", role: "5V", side: left}
      - {name: "GND", role: "GND", side: left}
      - {name: "R_EN", role: "GPIO", side: left}
      - {name: "L_EN", role: "GPIO", side: left}
      - {name: "RPWM", role: "PWM", side: left}
      - {name: "LPWM", role: "PWM", side: left}
      - {name: "R_IS (NC)", role: "GPIO", side: left}
      - {name: "L_IS (NC)", role: "GPIO", side: left}
      - {name: "B+", role: "5V", side: right}
      - {name: "B-", role: "GND", side: right}
      - {name: "M+", role: "5V", side: right}
      - {name: "M-", role: "GND", side: right}

  # 5.5 V battery — the main supply. Feeds the ESP32 (VIN), the BTS7960 logic
  # (VCC) and motor (B+/B-) directly. Sits on top-center; pins face right.
  - name: "Battery 5.5V"
    color: "#B00020"
    pins:
      - {name: "+", role: "5V", side: right}
      - {name: "-", role: "GND", side: right}

  - name: "Door motor"
    color: "#1565C0"
    pins:
      - {name: "M1", role: "5V", side: left}
      - {name: "M2", role: "GND", side: left}

connections:
  # ---- ESP32 -> DS3231 (I2C bus + alarm interrupt). The RTC is the ONLY
  #      device on the ESP32's regulated 3V3 rail. ----
  - {board_pin: 1,  device: "DS3231 RTC", device_pin: "VCC", color: "#D32F2F", net: "3V3 (ESP regulated)"}
  - {board_pin: 3,  device: "DS3231 RTC", device_pin: "GND", color: "#000000", net: "GND"}
  - {board_pin: 21, device: "DS3231 RTC", device_pin: "SDA", color: "#1565C0", net: "I2C SDA (GPIO21)"}
  - {board_pin: 27, device: "DS3231 RTC", device_pin: "SCL", color: "#F9A825", net: "I2C SCL (GPIO22)"}
  - {board_pin: 5,  device: "DS3231 RTC", device_pin: "SQW", color: "#EF6C00", net: "RTC INT/SQW -> GPIO15 (ext0 wake)"}

  # ---- ESP32 -> BTS7960 logic control (GPIO only, no power) ----
  - {board_pin: 14, device: "BTS7960 (IBT-2)", device_pin: "R_EN", color: "#2E7D32", net: "R_EN (GPIO26)"}
  - {board_pin: 12, device: "BTS7960 (IBT-2)", device_pin: "L_EN", color: "#2E7D32", net: "L_EN (GPIO27)"}
  - {board_pin: 16, device: "BTS7960 (IBT-2)", device_pin: "RPWM", color: "#6A1B9A", net: "RPWM (GPIO25)"}
  - {board_pin: 18, device: "BTS7960 (IBT-2)", device_pin: "LPWM", color: "#6A1B9A", net: "LPWM (GPIO33)"}

  # ---- 5.5 V battery -> all power inputs ----
  # The battery feeds the ESP32's VIN (board pin 2; the on-board regulator makes
  # the 3V3 the RTC runs on) and the BTS7960 directly — logic (VCC) and motor
  # (B+). Grounds are common: battery- ties to the ESP32 GND and the BTS.
  - {board_pin: 2, device: "Battery 5.5V", device_pin: "+", color: "#D32F2F", net: "Vbat+ 5.5V -> ESP VIN"}
  - {board_pin: 4, device: "Battery 5.5V", device_pin: "-", color: "#000000", net: "Vbat- -> ESP GND"}
  - {from: {device: "Battery 5.5V", device_pin: "+"}, to: {device: "BTS7960 (IBT-2)", device_pin: "VCC"}, color: "#D32F2F", net: "Vbat+ -> BTS VCC"}
  - {from: {device: "Battery 5.5V", device_pin: "-"}, to: {device: "BTS7960 (IBT-2)", device_pin: "GND"}, color: "#000000", net: "Vbat- -> BTS GND"}
  - {from: {device: "Battery 5.5V", device_pin: "+"}, to: {device: "BTS7960 (IBT-2)", device_pin: "B+"}, color: "#D32F2F", net: "Vbat+ -> BTS B+ (motor)"}
  - {from: {device: "Battery 5.5V", device_pin: "-"}, to: {device: "BTS7960 (IBT-2)", device_pin: "B-"}, color: "#000000", net: "Vbat- -> BTS B- (motor)"}

  # ---- BTS7960 -> door motor ----
  - {from: {device: "BTS7960 (IBT-2)", device_pin: "M+"}, to: {device: "Door motor", device_pin: "M1"}, color: "#757575", net: "motor lead"}
  - {from: {device: "BTS7960 (IBT-2)", device_pin: "M-"}, to: {device: "Door motor", device_pin: "M2"}, color: "#757575", net: "motor lead"}
