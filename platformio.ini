[platformio]
default_envs = dfrobot_firebeetle2_esp32c6

[env:dfrobot_firebeetle2_esp32c6]
; pioarduino platform (Arduino core 3.x, the only one shipping the
; dfrobot_firebeetle2_esp32c6 board). Pinned to a release so the build is
; reproducible on any machine; bump the URL deliberately to upgrade.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = dfrobot_firebeetle2_esp32c6
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/RTClib @ ^2.1.4
    ; The 1.0.1 registry release fails to build on case-sensitive filesystems
    ; (`#include <Math.h>`) and also has invalid C++ (redundant `static` on
    ; out-of-class member definitions) that only GCC's pre-13 leniency
    ; tolerated. Both are fixed on upstream's default branch, which was
    ; never tagged as a release, so pin directly to that commit.
    https://github.com/dmkishi/Dusk2Dawn.git#2e1224462877ee8a71d858f7db77afbef06b4ebb

build_flags =
    -D ARDUINO_HW_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0

; Same firmware, plus lifecycle traces (WiFi up, client joined, settings
; saved, door open/close) gated behind DEBUG_TRACES - see src/Debug.h.
; Kept as a separate env rather than a build flag on esp32dev so a plain
; `pio run` / `make build` stays trace-free by default.
[env:dfrobot_firebeetle2_esp32c6-debug]
extends = env:dfrobot_firebeetle2_esp32c6
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D DEBUG_TRACES

;build_type = debug
;debug_tool = esp-builtin
;debug_init_break = tbreak app_main