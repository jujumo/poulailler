[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/RTClib @ ^2.1.4

build_flags =
    -D CORE_DEBUG_LEVEL=0

; Pure-math unit tests for SunCalc, runnable on the host with no hardware.
[env:native]
platform = native
build_src_filter = +<SunCalc.cpp>
