[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/RTClib @ ^2.1.4

build_flags =
    -D CORE_DEBUG_LEVEL=0

; Pure-math unit tests for SunCalc, runnable on the host with no hardware.
; Test-only: use `pio test -e native`, NOT `pio run -e native` / VS Code's
; "Build" action. This env has no main() of its own (build_src_filter
; excludes main.cpp, which needs ESP32/Arduino headers anyway), so a plain
; Build will fail to link with "undefined reference to `main'" - that's
; expected. The Unity-provided main() only gets linked in during `pio test`.
[env:native]
platform = native
build_src_filter = +<SunCalc.cpp>
