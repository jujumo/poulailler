[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/RTClib @ ^2.1.4
    ; The 1.0.1 registry release fails to build on case-sensitive filesystems
    ; (`#include <Math.h>`) and also has invalid C++ (redundant `static` on
    ; out-of-class member definitions) that only GCC's pre-13 leniency
    ; tolerated. Both are fixed on upstream's default branch, which was
    ; never tagged as a release, so pin directly to that commit.
    https://github.com/dmkishi/Dusk2Dawn.git#2e1224462877ee8a71d858f7db77afbef06b4ebb

build_flags =
    -D CORE_DEBUG_LEVEL=0
